[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "splixrl"
version = "0.1.0"
description = "A Splix.io-style territory game for comparing RL algorithms (CS 4180/5180)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "gymnasium>=0.29",
    "torch>=2.1",
    "matplotlib>=3.7",
    "pillow>=9",
    "pygame>=2.5",
    "websockets>=12",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["splixrl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
